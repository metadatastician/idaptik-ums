#
# Universal Modding Studio Cargo workspace.
#
# Deliberately NOT depending on either game runtime. UMS integrates through
# game-owned versioned contract artifacts and package loaders. The IDApTIK
# profile consumes contracts/idaptik/v1 from the sibling game; it does not
# re-declare ScenarioDefinition or LevelData locally.
[workspace]
resolver = "3"
# ums-profile-sdk and ums-profiles are complementary, not competing (ADR-0015).
# The SDK has the reflection model and no compiler; ums-profiles has the
# package compiler and no reflection model. Keep both.
members = [
    "crates/ums-ai-edit",
    "crates/ums-dlc",
    "crates/ums-profile-sdk",
    "crates/ums-profiles",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
authors = ["Jonathan D.A. Jewell <j.d.a.jewell@open.ac.uk>"]
repository = "https://github.com/metadatastician/universal-modding-studio"

[workspace.dependencies]
# `float_roundtrip` guarantees bit-exact f64 JSON round-trips, matching the
# sibling IDApTIK workspace: edit scripts carry worldX geometry as JSON
# numbers and must replay identically.
serde_json = { version = "1", features = ["float_roundtrip"] }
serde = { version = "1", features = ["derive"] }
clap = { version = "4", features = ["derive"] }
