# SPDX-License-Identifier: AGPL-3.0-or-later
# This workflow is managed by gh actions-lock.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 0 * * 0'

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.1.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3.37.3
        with:
          # "auto" is not a value the init action accepts ("Did not recognize
          # the following languages: auto"). This repo's CodeQL-supported
          # surfaces are the Rust crates and the Actions workflows themselves;
          # Idris2 and Zig have no CodeQL extractor.
          languages: rust,actions

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3.37.3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3.37.3
